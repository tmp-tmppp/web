apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "web.fullname" . }}
  labels:
    {{- include "web.labels" . | nindent 4 }}
data:
  # Mounted over /usr/share/nginx/html/config.json; the browser reads it before it starts the app.
  config.json: |
    {{- .Values.config | toPrettyJson | nindent 4 }}
