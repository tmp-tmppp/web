# Headers of every response (included in each location; see default.conf.template). The Content-Security-Policy is
# only on the document. TLS ends at the gateway, so Strict-Transport-Security is its job, not this server's.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
