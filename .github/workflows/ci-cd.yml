# CI/CD of the web UI. The steps live in the organization's shared workflow
# (RSO-ekipa10/.github, .github/workflows/service-ci-cd.yml); this file only says when it runs
# and with which settings. The shared workflow fits a static site as it is: "npm ci", lint, type check, tests with
# coverage, chart lint and kubeconform of the dev and prod values, a "helm test" hook check and an image build on a pull
# request; on a push to main it pushes the image once and runs "helm upgrade" and the smoke test of the chart.
#   pull request   tests and checks (required check "pipeline / test")
#   push to main   tests, image built once and pushed to Docker Hub, Helm deploy to prod, smoke test
#   manual run     redeploy or roll back to the image of an earlier commit of main (input "sha")
# The Helm release must be named "web" (the Service the gateway routes "/" to), which is the "service" input. The UI
# has no secrets, so no "app-env" is passed and no Kubernetes Secret is made.
name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Redeploy or roll back to the image of this full commit SHA from main (empty = newest commit)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  # Pull requests: a newer push cancels the older run. Main and manual runs from main share one
  # group, and a newer run never cancels a running one (a killed "helm upgrade" leaves the
  # release stuck). GitHub keeps only one waiting run per group, so a newer merge or manual run
  # replaces the waiting one and the newest commit wins: a replaced merge is not built (it shows
  # as cancelled; its changes ship with the newer commit), and a manual run with an empty sha
  # works only once the newest commit of main has been built. A manual run from another branch
  # gets its own group and deploys nothing (only main deploys).
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.ref != 'refs/heads/main') && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    # A called workflow gets at most these permissions; only its deploy job asks for id-token.
    permissions:
      contents: read
      id-token: write # Azure login with OIDC in the deploy job
    # Temporary: @main until the first reviewed release tag of RSO-ekipa10/.github exists. Then
    # pin it to that tag's commit SHA (gh api repos/RSO-ekipa10/.github/commits/<tag> --jq .sha):
    #   uses: RSO-ekipa10/.github/.github/workflows/service-ci-cd.yml@<40-character SHA> # <tag>
    # Dependabot keeps the pin and its comment current from then on.
    uses: tmp-tmppp/.github/.github/workflows/service-ci-cd.yml@main
    with:
      service: web
      dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      sha: ${{ inputs.sha }}
      public-host: ${{ vars.PUBLIC_HOST }}
      host-values: |
        config.issuer=https://{host}/realms/chance
    secrets:
      # Named secrets only (no "inherit"): the shared workflow gets nothing else.
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }} # secrets, so the public logs mask them
      azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
